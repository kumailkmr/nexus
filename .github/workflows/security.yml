name: Security & Quality

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Dependency Audit
        run: npm audit --audit-level=high

      # Secret scanning is handled natively by GitHub Advanced Security
      # But we can add a lightweight check if desired
      - name: Secret Scan Baseline
        run: |
          if grep -r -iE "(SUPABASE_SERVICE_ROLE_KEY=|OPENAI_API_KEY=|HIGGSFIELD_API_KEY=)" src/ app/; then
            echo "Secrets detected in source code!"
            exit 1
          fi
